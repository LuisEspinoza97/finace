server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El navegador solo habla con este dominio. Nginx reenvia /api/ al
    # contenedor del backend por la red interna de docker-compose, asi
    # nunca hay una peticion cross-origin real: sin CORS, y la cookie de
    # sesion (SameSite=Strict) viaja sin problema.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

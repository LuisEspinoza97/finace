server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El navegador solo habla con este dominio. Nginx reenvia /api/ al
    # contenedor del backend por la red interna de docker-compose, asi
    # nunca hay una peticion cross-origin real: sin CORS, y la cookie de
    # sesion (SameSite=Strict) viaja sin problema.
    #
    # "api" solo existe como nombre dentro de esa red interna (docker-compose).
    # En despliegues donde este bloque no se usa (ej. Render, donde el
    # frontend le habla directo a la URL publica del backend via
    # VITE_API_URL), resolver ese nombre al arrancar tumbaria nginx entero.
    # El resolver + la variable difieren la resolucion hasta que alguien
    # pegue realmente a /api/, en vez de resolverla al arrancar.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

[project]
name = "radiografia-financiera-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "pyjwt>=2.9",
    "passlib>=1.7",
    # passlib 1.7.4 (ultima release, el proyecto esta sin mantenimiento) lee
    # bcrypt.__about__.__version__, que bcrypt >=4.0 elimino. Fijar <4 evita
    # el crash "module 'bcrypt' has no attribute '__about__'" al hashear.
    "bcrypt>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
